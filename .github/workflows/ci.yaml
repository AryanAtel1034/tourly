name: Build and Push to ECR

on:
  push:
    branches:
      - add-docker-support   # change if your branch is different

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write      # REQUIRED for OIDC
      contents: read

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: dev/mfe-tour
      ACCOUNT_ID: 194477973016

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::194477973016:role/ECR-Admin_access
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY .

      - name: Tag Docker image
        run: |
          docker tag $ECR_REPOSITORY:latest \
          $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
          $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest